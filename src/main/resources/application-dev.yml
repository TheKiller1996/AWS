server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:journal}
    username: ${DB_USER:journal_app}
    password: ${DB_PASSWORD:journal_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:clustercfg.journal-cache.6mnlvt.use1.cache.amazonaws.com}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:3duA4gEeZDX7TvWbFOS+N5K5nVb/TKDT8bHWaxRBFMw=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  upload-dir: ${UPLOAD_DIR:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.journal: DEBUG
    org.flywaydb: DEBUG